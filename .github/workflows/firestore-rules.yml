name: Publish Firestore rules

# Publishes firestore.rules to the live database whenever it changes on
# main, so the file in this repo and the rules actually enforcing
# permissions can't drift apart.
#
# They drifted repeatedly before this existed: the file said "paste this
# into the Firebase console", which meant every new collection shipped
# with its tool but without its permissions, and the tool answered
# "Missing or insufficient permissions" until someone remembered. The
# rules are the security model -- they shouldn't depend on remembering.
#
# Uses scripts/publish_rules.py rather than the Firebase CLI. The CLI
# checks whether the Firestore API is enabled before deploying, which a
# Firebase Admin SDK service account isn't permitted to do, so it failed
# with "Permission denied to get service [firestore.googleapis.com]"
# before reaching the rules at all. Widening the key's permissions to
# satisfy a pre-flight check whose answer we already know would be the
# wrong trade; the script calls the Rules API directly instead. See the
# script's own comment for the detail.
#
# Uses the FIREBASE_SERVICE_ACCOUNT secret the Todoist sync already uses.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "scripts/publish_rules.py"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch: {}

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install google-auth
        run: pip install --quiet google-auth

      - name: Write the service account key to a file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          # Written to the runner's own temp dir, which is destroyed with
          # the run. Never echoed, and never inside the checkout, so it
          # cannot be committed by accident.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          python3 - <<'EOF'
          import json, os, sys
          path = os.environ["RUNNER_TEMP"] + "/service-account.json"
          try:
              key = json.load(open(path))
          except ValueError as e:
              sys.exit(f"The secret isn't valid JSON: {e}")
          # client_email and project_id identify the key; neither is
          # secret. The private key itself is never printed.
          print("service account:", key.get("client_email", "MISSING"))
          print("key's project:  ", key.get("project_id", "MISSING"))
          EOF

      - name: Publish
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: python3 scripts/publish_rules.py

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
