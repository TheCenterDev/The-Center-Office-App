name: Build and Release

# Builds TheCenterOfficeLauncher for both Windows and Mac on GitHub's own
# machines, then publishes both as a single "Latest Build" GitHub Release.
#
# Anyone (you or a new office member) can go to the repo's "Releases"
# section, download the zip for their OS, unzip it, and run the app
# immediately — no Python, no pip, no pyinstaller, no manual folder
# assembly required.
#
# Runs automatically on every push to main, or on demand via the
# "Run workflow" button in the Actions tab.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write   # required so this workflow can publish a Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pillow is listed explicitly on purpose: launcher.py needs it for the
      # logo and the drawn search/team icons, but nothing here depends on it
      # anymore now that customtkinter 6.x no longer pulls it in on its own.
      # Leaving it implicit is what shipped a build with no logo at all --
      # the PIL import is wrapped in try/except so the app ran fine, just
      # with every image silently missing.
      - name: Install dependencies
        run: pip install pyinstaller customtkinter tkinterweb pywebview pillow

      - name: Verify Pillow is importable before building
        run: python -c "from PIL import Image, ImageDraw; print('Pillow OK')"

      - name: Build executable
        run: pyinstaller launcher.spec --noconfirm

      - name: Assemble release folder (exe + html + assets)
        shell: cmd
        run: |
          mkdir release
          copy dist\TheCenterOfficeLauncher.exe release\
          xcopy /E /I html release\html
          if exist assets (xcopy /E /I assets release\assets) else (mkdir release\assets)

      - name: Zip it up
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath TheCenterOfficeLauncher-Windows.zip

      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: TheCenterOfficeLauncher-Windows.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # See the note on the Windows job above -- pillow must be explicit.
      - name: Install dependencies
        run: pip install pyinstaller customtkinter tkinterweb pywebview pillow

      - name: Verify Pillow is importable before building
        run: python -c "from PIL import Image, ImageDraw; print('Pillow OK')"

      - name: Build app
        run: pyinstaller launcher.spec --noconfirm

      # Fails the build rather than shipping another app with no logo:
      # PIL landing in the bundle is the thing that actually broke, and
      # it broke silently, so it gets checked on the built output itself
      # rather than trusted from the install step above.
      - name: Verify Pillow made it into the built app
        run: |
          if ! find dist/TheCenterOfficeLauncher.app -iname "_imaging*" | grep -q .; then
            echo "Pillow's compiled _imaging extension is missing from the built app."
            echo "The logo and drawn icons would silently not render. Failing the build."
            exit 1
          fi
          echo "Pillow bundled OK."

      # Just the .app now -- html/ and assets/ are bundled inside it and
      # get copied into ~/Library/Application Support on first launch.
      # Shipping loose copies beside the app is what led to people
      # dragging them into /Applications, which is the clutter this
      # whole arrangement replaces.
      - name: Assemble release folder (app only)
        run: |
          mkdir release
          cp -R dist/TheCenterOfficeLauncher.app release/

      - name: Zip it up
        run: (cd release && zip -r ../TheCenterOfficeLauncher-Mac.zip .)

      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: TheCenterOfficeLauncher-Mac.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Download Mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-zip

      - name: Publish / update the "Latest Build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          make_latest: true
          body: >
            Automatically rebuilt from the latest code on main.
            Download the zip for your OS, unzip it, and run —
            no setup required. On Mac, right-click the app and
            choose "Open" the first time (Gatekeeper warning).
          files: |
            TheCenterOfficeLauncher-Windows.zip
            TheCenterOfficeLauncher-Mac.zip
