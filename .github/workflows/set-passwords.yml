name: Set staff roles

# Syncs each person's role (staff / admin / director) from
# scripts/staff-list.json to their Firestore profile. See
# scripts/set_password_and_roles.js.
#
# By default this does NOT touch anyone's password. People set their own
# by opening the mobile site, entering their email, and tapping "Forgot
# password?", which has Firebase email them a link.
#
# Manual only -- there is no schedule.
#
# Required repository secret (Settings -> Secrets and variables ->
# Actions):
#   FIREBASE_SERVICE_ACCOUNT  -- full contents of a Firebase service
#                                account JSON key (already set up for
#                                the Todoist sync workflow)
#
# Optional, and normally left unset:
#   STAFF_SHARED_PASSWORD     -- if present, ALSO overwrites every
#                                listed person's password with this
#                                value, including for anyone who has
#                                already chosen their own.

on:
  workflow_dispatch: {}

jobs:
  set-passwords:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install firebase-admin --no-audit --no-fund

      - name: Apply roles
        env:
          STAFF_SHARED_PASSWORD: ${{ secrets.STAFF_SHARED_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/set_password_and_roles.js
