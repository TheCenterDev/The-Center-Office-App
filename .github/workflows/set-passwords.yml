name: Set staff passwords and roles

# Applies one shared password to every account in scripts/staff-list.json
# and syncs each person's role from that same file. See
# scripts/set_password_and_roles.js.
#
# Manual only -- there is no schedule. Running this resets everyone's
# mobile-site password, including for anyone who has since chosen their
# own in Settings -> Security, so it should be a deliberate act.
#
# Required repository secrets (Settings -> Secrets and variables ->
# Actions):
#   STAFF_SHARED_PASSWORD     -- the password to apply to everyone
#   FIREBASE_SERVICE_ACCOUNT  -- full contents of a Firebase service
#                                account JSON key (already set up for
#                                the Todoist sync workflow)

on:
  workflow_dispatch: {}

jobs:
  set-passwords:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install firebase-admin --no-audit --no-fund

      - name: Apply passwords and roles
        env:
          STAFF_SHARED_PASSWORD: ${{ secrets.STAFF_SHARED_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/set_password_and_roles.js
