name: Set staff roles

# Syncs each person's role (staff / admin / director) from
# scripts/staff-list.json to their Firestore profile.
# See scripts/set_roles.js.
#
# This cannot change anyone's password -- there is no shared password in
# this system. People set their own by opening the mobile site, entering
# their email, and tapping "Forgot password?", which has Firebase email
# them a link.
#
# Manual only -- there is no schedule.
#
# Required repository secret (Settings -> Secrets and variables ->
# Actions):
#   FIREBASE_SERVICE_ACCOUNT  -- full contents of a Firebase service
#                                account JSON key (already set up for
#                                the Todoist sync workflow)

on:
  workflow_dispatch: {}

jobs:
  set-roles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install firebase-admin --no-audit --no-fund

      - name: Apply roles
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/set_roles.js
