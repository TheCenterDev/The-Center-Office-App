<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEL Session Planner</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1a2233; --muted: #6b7486;
    --line: #e3e6eb; --blue: #2456d6; --green: #1a7f4e; --green-bg: #e8f6ee;
    --red: #b3261e; --red-bg: #fdecea; --amber: #8a5a00; --amber-bg: #fff4d6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); padding: 32px 16px 80px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin-bottom: 4px; }
  .card .subhead { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }

  .cohortbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select, input[type=text] {
    font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  select:focus, input:focus { border-color: var(--blue); }
  button { font: inherit; border: none; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
  .primary { background: var(--blue); color: #fff; }
  .primary:disabled { background: #b9c4dd; cursor: not-allowed; }
  .ghost { background: transparent; color: var(--blue); border: 1px solid var(--line); }
  .danger { background: transparent; color: var(--red); border: 1px solid var(--red-bg); }

  .progressbar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 10px 0 4px; }
  .progressfill { height: 100%; background: var(--blue); transition: width .2s; }
  .progresslabel { font-size: 13px; color: var(--muted); }

  .next {
    background: var(--green-bg); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px;
  }
  .next .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--green); margin-bottom: 6px; }
  .next h3 { font-size: 16px; margin-bottom: 4px; }
  .next .principle { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .next p.desc { font-size: 14px; margin-bottom: 12px; }

  .topiclist { display: flex; flex-direction: column; gap: 2px; }
  .topic {
    display: flex; align-items: flex-start; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line);
  }
  .topic:last-child { border-bottom: none; }
  .topic .num { width: 22px; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .topic .body { flex: 1; }
  .topic .title { font-size: 14.5px; font-weight: 600; }
  .topic .principle { font-size: 12.5px; color: var(--muted); }
  .topic .desc { font-size: 13px; color: var(--ink); margin-top: 3px; }
  .topic.covered .title { color: var(--muted); }
  .topic .actions { display: flex; gap: 6px; align-items: center; }
  .topic .datechip { font-size: 11.5px; color: var(--green); font-weight: 600; }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  @media print {
    .cohortbar, #printBtn, .actions button { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>SEL Session Planner</h1>
  <p class="sub">Habitudes (Growing Leaders) — pick a cohort and course, track which topics have been covered, and print a session outline for the next one.</p>

  <div class="card">
    <div class="cohortbar">
      <select id="cohortSelect"></select>
      <button class="ghost" id="newCohortBtn" type="button">+ New Cohort</button>
      <button class="danger" id="removeCohortBtn" type="button">Remove This Cohort</button>
    </div>
  </div>

  <div id="area"></div>
</div>

<script>
// Habitudes SEL curriculum (Growing Leaders, 2020) — four courses.
const COURSES = {
  SEL1: { label: "Course One", topics: [
    { title: "The Iceberg", principle: "Ethical Responsibility", desc: "Unethical decisions ruin our reputation." },
    { title: "Golden Buddha", principle: "Recognizing Strengths", desc: "The value of knowing and leveraging our strengths and gifts." },
    { title: "The Starving Baker", principle: "Stress Management", desc: "Feeding yourself in healthy ways is the key to managing stress." },
    { title: "Hosts & Guests", principle: "Social Engagement", desc: "Exceed expectations and be intentional with relationships." },
    { title: "A Compass or a GPS", principle: "Self-Efficacy", desc: "We need core values to guide us in new situations." },
    { title: "Pyrrhic Victory", principle: "Impulse Control", desc: "Choose our battles, so we don't lose more than we gain." },
    { title: "Salutes & Snubs", principle: "Respect for Others", desc: "We must go out of our way to show respect to others." },
    { title: "Hot Air Balloons", principle: "Relationship Building", desc: "The importance of encouragement to bring out potential in others." },
    { title: "Fun House Mirror", principle: "Accurate Self-Perception", desc: "The power of authenticity to our character and personal brand." },
    { title: "Trade-Offs", principle: "Evaluating", desc: "We must use wisdom to decide between two good options." },
    { title: "Discipline Bridge", principle: "Self-Discipline", desc: "Personal discipline is a bridge that leads to our personal goals." },
    { title: "Emotional Fuel", principle: "Identifying Emotions", desc: "Our emotions are shaped by the people we allow close to us." },
    { title: "Cathedral Building", principle: "Perspective-Taking", desc: "Look past the task in front of us and see the bigger picture." },
  ]},
  SEL2: { label: "Course Two", topics: [
    { title: "Baggage Fees", principle: "Identifying Emotions", desc: "Address our emotional baggage if we are going to move forward." },
    { title: "The Oversized Gift", principle: "Accurate Self-Perception", desc: "Relying solely on our gifts puts us at risk of self-sabotage." },
    { title: "Gift Factor", principle: "Recognizing Strengths", desc: "Using our gift is the best way to shape the culture around us." },
    { title: "Thermostat & Thermometer", principle: "Self-Confidence", desc: "Influence others by choosing values and adding value to others." },
    { title: "Life Sentence", principle: "Self-Efficacy", desc: "Live so that our legacy is something we are proud of." },
    { title: "Tollbooths & Roadblocks", principle: "Self-Efficacy", desc: "See challenges as an opportunity to grow." },
    { title: "Sturdy Guardrails", principle: "Impulse Control", desc: "Build boundaries in our life to keep us out of trouble." },
    { title: "Three Buckets", principle: "Stress Management", desc: "When to take responsibility and when to trust others." },
    { title: "Pop Quiz", principle: "Self-Discipline", desc: "The various 'tests' we face are proving grounds for our growth." },
    { title: "Drivers & Passengers", principle: "Self-Motivation", desc: "Taking personal responsibility is necessary for success." },
    { title: "Big Rocks First", principle: "Goal Setting", desc: "Schedule our priorities to effectively reach our goals." },
    { title: "Rivers & Floods", principle: "Organizational Skills", desc: "Focus our time, money, and effort towards one clear vision." },
    { title: "Opportunity Statue", principle: "Organizational Skills", desc: "We can choose to spend, invest, or waste each day we have." },
  ]},
  SEL3: { label: "Course Three", topics: [
    { title: "Windshields & Rearview Mirrors", principle: "Perspective-Taking", desc: "Let go of our past to make future progress." },
    { title: "Stethoscopes & Treatments", principle: "Empathy", desc: "Empathize with others' needs before offering help." },
    { title: "Culture & Customs", principle: "Empathy", desc: "People act differently based on their culture and experiences." },
    { title: "A Bridge Not a Wall", principle: "Appreciating Diversity", desc: "Build bridges of trust with others who are different from us." },
    { title: "Chess & Checkers", principle: "Appreciating Diversity", desc: "Work with others based on their strengths and personality." },
    { title: "The Talking Stick", principle: "Respect for Others", desc: "Listen and empathize before we speak." },
    { title: "The Velvet Covered Brick", principle: "Communication", desc: "Be soft with people and firm with values." },
    { title: "The Poet's Gift", principle: "Communication", desc: "Interpret the landscape before we start talking." },
    { title: "The Waldorf Principle", principle: "Social Engagement", desc: "The effectiveness of extravagant and sacrificial service in leadership." },
    { title: "The Ripple Effect", principle: "Social Engagement", desc: "Changing culture starts with small communities." },
    { title: "Pocket Change", principle: "Relationship Building", desc: "Earn credibility through integrity and wise decisions." },
    { title: "The Gardener's Job", principle: "Relationship Building", desc: "Healthy environments are the key to developing others." },
    { title: "Dorothy's Way", principle: "Teamwork", desc: "Act as a guide for others while they discover their strengths." },
  ]},
  SEL4: { label: "Course Four", topics: [
    { title: "3D Glasses", principle: "Identifying Problems", desc: "Think critically, learning to see all angles of the situation." },
    { title: "Taxi Principle", principle: "Analyzing Solutions", desc: "Look ahead in order to properly plan and prepare for what's coming." },
    { title: "Barn Building", principle: "Analyzing Solutions", desc: "Focus on what is necessary before what is desired." },
    { title: "Bikes & Birds", principle: "Solving Problems", desc: "See the potential innovations in our everyday realities." },
    { title: "Duck Hunting", principle: "Evaluating", desc: "Focus on our successes rather than our failures." },
    { title: "Bit Market", principle: "Reflecting", desc: "Devote our efforts to our mission instead of our methods." },
    { title: "The Mirror Effect", principle: "Reflecting", desc: "Our good and bad habits are reflected in those around us." },
    { title: "Shortcut or Second Mile", principle: "Ethical Responsibility", desc: "Choose long term goals over instant gratification." },
    { title: "Flight Delay", principle: "Identifying Emotions", desc: "Be realistic with our expectations and manage our frustration." },
    { title: "Personal Laptop", principle: "Impulse Control", desc: "What we put into our mind is what will eventually come out." },
    { title: "Small Sprocket", principle: "Self-Motivation", desc: "Working hard to affect change eventually inspires others to join you." },
    { title: "Lightning Rods", principle: "Relationship Building", desc: "Embrace criticism and conflict while redirecting negativity." },
    { title: "Half-Hearted Mountain Climber", principle: "Self-Motivation", desc: "Commitment is the key to success for lasting leaders." },
  ]},
};

const STORAGE_KEY = "center_sel_planner_v1";
function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let data = load(); // { cohortId: { name, course, covered: { topicIndex: dateString } } }
let currentId = Object.keys(data)[0] || null;

function renderCohortSelect() {
  const sel = document.getElementById("cohortSelect");
  sel.innerHTML = "";
  const ids = Object.keys(data);
  if (!ids.length) {
    const opt = document.createElement("option");
    opt.textContent = "No cohorts yet — click + New Cohort";
    sel.appendChild(opt);
    return;
  }
  ids.forEach(id => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = data[id].name || "(unnamed)";
    if (id === currentId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function newCohort() {
  const name = prompt("Cohort name (e.g. \"Whitko After School — Fall 2026\"):");
  if (!name) return;
  const id = "c" + Date.now();
  data[id] = { name, course: "SEL1", covered: {} };
  currentId = id;
  save(data);
  renderCohortSelect();
  renderArea();
}

function removeCohort() {
  if (!currentId) return;
  if (!confirm("Remove " + (data[currentId].name || "this cohort") + "?")) return;
  delete data[currentId];
  currentId = Object.keys(data)[0] || null;
  save(data);
  renderCohortSelect();
  renderArea();
}

function renderArea() {
  const area = document.getElementById("area");
  area.innerHTML = "";
  if (!currentId || !data[currentId]) {
    area.innerHTML = '<div class="empty">Add a new cohort above to start planning sessions.</div>';
    return;
  }
  const cohort = data[currentId];
  const course = COURSES[cohort.course];
  const coveredCount = Object.keys(cohort.covered).length;
  const pct = Math.round(100 * coveredCount / course.topics.length);

  const courseCard = document.createElement("div");
  courseCard.className = "card";
  courseCard.innerHTML = `
    <div class="cohortbar" style="margin-bottom:10px;">
      <label style="font-size:13px; color:var(--muted); font-weight:600;">Course:</label>
      <select id="courseSelect">
        ${Object.keys(COURSES).map(k => `<option value="${k}" ${k === cohort.course ? "selected" : ""}>${k} — ${COURSES[k].label}</option>`).join("")}
      </select>
    </div>
    <div class="progressbar"><div class="progressfill" style="width:${pct}%"></div></div>
    <div class="progresslabel">${coveredCount} of ${course.topics.length} topics covered (${pct}%)</div>
  `;
  area.appendChild(courseCard);
  courseCard.querySelector("#courseSelect").addEventListener("change", e => {
    cohort.course = e.target.value;
    cohort.covered = {};
    save(data);
    renderArea();
  });

  // Next suggested topic
  let nextIdx = course.topics.findIndex((t, i) => !cohort.covered[i]);
  if (nextIdx !== -1) {
    const t = course.topics[nextIdx];
    const nextDiv = document.createElement("div");
    nextDiv.className = "next";
    nextDiv.innerHTML = `
      <div class="tag">Next Suggested Session</div>
      <h3>${t.title}</h3>
      <div class="principle">Principle: ${t.principle}</div>
      <p class="desc">${t.desc}</p>
      <button class="primary" id="printOutlineBtn" type="button">Print Session Outline</button>
    `;
    area.appendChild(nextDiv);
    nextDiv.querySelector("#printOutlineBtn").addEventListener("click", () => printOutline(cohort, course, nextIdx));
  } else {
    const doneDiv = document.createElement("div");
    doneDiv.className = "next";
    doneDiv.innerHTML = `<div class="tag">All Done</div><h3>Every topic in ${cohort.course} has been covered 🎉</h3><p class="desc">Switch to another course above to keep going.</p>`;
    area.appendChild(doneDiv);
  }

  // Full topic list
  const listCard = document.createElement("div");
  listCard.className = "card";
  listCard.innerHTML = `<h2>All Topics — ${cohort.course}: ${course.label}</h2><div class="subhead">Mark a session covered as you go, or jump ahead if you taught out of order.</div>`;
  const list = document.createElement("div");
  list.className = "topiclist";
  course.topics.forEach((t, i) => {
    const covered = cohort.covered[i];
    const row = document.createElement("div");
    row.className = "topic" + (covered ? " covered" : "");
    row.innerHTML = `
      <div class="num">${i + 1}</div>
      <div class="body">
        <div class="title">${t.title}</div>
        <div class="principle">${t.principle}</div>
        <div class="desc">${t.desc}</div>
      </div>
      <div class="actions">
        ${covered ? `<span class="datechip">Covered ${covered}</span><button class="ghost" data-uncover="${i}" type="button">Undo</button>` : `<button class="ghost" data-cover="${i}" type="button">Mark Covered</button>`}
        <button class="ghost" data-print="${i}" type="button">Print</button>
      </div>
    `;
    list.appendChild(row);
  });
  listCard.appendChild(list);
  area.appendChild(listCard);

  listCard.querySelectorAll("[data-cover]").forEach(btn => {
    btn.addEventListener("click", () => {
      cohort.covered[btn.dataset.cover] = new Date().toISOString().slice(0, 10);
      save(data);
      renderArea();
    });
  });
  listCard.querySelectorAll("[data-uncover]").forEach(btn => {
    btn.addEventListener("click", () => {
      delete cohort.covered[btn.dataset.uncover];
      save(data);
      renderArea();
    });
  });
  listCard.querySelectorAll("[data-print]").forEach(btn => {
    btn.addEventListener("click", () => printOutline(cohort, course, parseInt(btn.dataset.print, 10)));
  });
}

function printOutline(cohort, course, idx) {
  const t = course.topics[idx];
  const w = window.open("", "_blank");
  w.document.write(`
    <html><head><title>${t.title} — Session Outline</title>
    <style>
      body { font-family: -apple-system, Segoe UI, Arial, sans-serif; color: #1a2233; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
      h1 { font-size: 24px; margin-bottom: 4px; }
      .meta { color: #6b7486; font-size: 13px; margin-bottom: 24px; }
      h2 { font-size: 15px; margin-top: 24px; margin-bottom: 6px; }
      .lines { border-bottom: 1px solid #e3e6eb; height: 28px; margin-bottom: 10px; }
    </style></head><body>
    <h1>${t.title}</h1>
    <div class="meta">${cohort.name} · ${course.label} · Principle: ${t.principle}</div>
    <p>${t.desc}</p>
    <h2>Opening / Hook</h2>
    <div class="lines"></div><div class="lines"></div>
    <h2>Discussion Questions</h2>
    <div class="lines"></div><div class="lines"></div><div class="lines"></div>
    <h2>Activity</h2>
    <div class="lines"></div><div class="lines"></div>
    <h2>Wrap-Up / Takeaway</h2>
    <div class="lines"></div><div class="lines"></div>
    </body></html>
  `);
  w.document.close();
  w.print();
}

document.getElementById("cohortSelect").addEventListener("change", e => { currentId = e.target.value; renderArea(); });
document.getElementById("newCohortBtn").addEventListener("click", newCohort);
document.getElementById("removeCohortBtn").addEventListener("click", removeCohort);

renderCohortSelect();
renderArea();
</script>
</body>
</html>
