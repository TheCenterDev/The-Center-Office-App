<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Hire Onboarding Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1a2233; --muted: #6b7486;
    --line: #e3e6eb; --blue: #2456d6; --green: #1a7f4e; --green-bg: #e8f6ee;
    --red: #b3261e; --red-bg: #fdecea; --amber: #8a5a00; --amber-bg: #fff4d6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); padding: 32px 16px 80px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }

  .hirebar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select, input[type=text], input[type=date], input[type=email], input[type=password] {
    font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  select:focus, input:focus { border-color: var(--blue); }
  button { font: inherit; border: none; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
  .primary { background: var(--blue); color: #fff; }
  .primary:disabled { background: #b9c4dd; cursor: not-allowed; }
  .ghost { background: transparent; color: var(--blue); border: 1px solid var(--line); }
  .danger { background: transparent; color: var(--red); border: 1px solid var(--red-bg); }

  .progresswrap { margin: 16px 0 4px; }
  .progressbar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .progressfill { height: 100%; background: var(--blue); transition: width .2s; }
  .progresslabel { font-size: 13px; color: var(--muted); margin-top: 6px; }

  section.group { margin-bottom: 22px; }
  section.group h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
  .item input[type=checkbox] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--blue); cursor: pointer; }
  .item label { font-size: 14.5px; line-height: 1.45; cursor: pointer; }
  .item.done label { color: var(--muted); text-decoration: line-through; }
  .item .hint { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; text-decoration: none; }
  .item a.dl { color: var(--blue); font-weight: 600; text-decoration: none; }
  .item a.dl:hover { text-decoration: underline; }

  .addrow { display: flex; gap: 8px; margin-top: 8px; }
  .addrow input { flex: 1; }

  .notifybar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .notifybar .who { font-size: 12.5px; color: var(--muted); }

  .banner { border-radius: 12px; padding: 14px 18px; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
  .banner.ok { background: var(--green-bg); color: var(--green); }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12.5px; color: var(--muted); }
  .topbar button { padding: 5px 10px; font-size: 12.5px; }

  #authGate { max-width: 360px; margin: 60px auto; }
  #authGate .card { text-align: center; }
  #authGate label { text-align: left; display: block; margin-top: 10px; }
  #authError { color: var(--red); font-size: 13px; min-height: 1em; margin-top: 8px; }
  #appArea { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>New Hire Onboarding Tracker</h1>
  <p class="sub">Track a new hire's onboarding checklist and send progress updates to the directors — shared live across everyone signed in, on any device.</p>

  <div id="authGate">
    <div class="card">
      <h2>Sign in</h2>
      <p class="sub" style="margin-bottom: 14px;">Same account as the mobile site. Ask an Admin or Director if you don't have one yet.</p>
      <form id="authForm">
        <label class="fl">Email</label>
        <input type="email" id="authEmail" autocomplete="username" required>
        <label class="fl">Password</label>
        <input type="password" id="authPassword" autocomplete="current-password" required>
        <div id="authError"></div>
        <button class="primary" type="submit" style="width:100%; margin-top:14px;">Sign in</button>
      </form>
    </div>
  </div>

  <div id="appArea">
    <div class="topbar">
      <span id="whoami"></span>
      <button class="ghost" id="signOutBtn" type="button">Sign out</button>
    </div>

    <div class="card">
      <div class="hirebar">
        <select id="hireSelect"></select>
        <button class="ghost" id="newHireBtn" type="button">+ New Hire</button>
        <button class="danger" id="removeHireBtn" type="button">Remove This Hire</button>
        <button class="ghost" id="editChecklistBtn" type="button" style="display:none;">Edit Checklist</button>
      </div>
    </div>

    <div id="hireArea"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* Same Firebase project as the mobile site's login (see
 * web/firebase-config.js / web/auth.js) -- this is not a secret, see
 * that file's comment for why. Each hire's record lives in the
 * "onboarding_hires" Firestore collection, synced live to everyone
 * signed in via onSnapshot, replacing the old single-device
 * localStorage version. */
firebase.initializeApp({
  apiKey: "AIzaSyB2rLNc8NaBcWzk_kCyhulEIseXeMbNZEg",
  authDomain: "the-center-office-app.firebaseapp.com",
  projectId: "the-center-office-app",
  storageBucket: "the-center-office-app.firebasestorage.app",
  messagingSenderId: "282726386673",
  appId: "1:282726386673:web:bdd0c91062a7ac2d0b9250",
  measurementId: "G-GFVPF8N6ZF",
});
const auth = firebase.auth();
const db = firebase.firestore();

// Directors / admin contacts (from the Key Contacts page) who get onboarding-progress emails.
const DIRECTORS = [
  { name: "Jeff Wike", role: "Executive Director", email: "jeff@thecentercc.com" },
  { name: "Brad Boyles", role: "IT and Director", email: "brad@thecentercc.com" },
  { name: "Jake Johnson", role: "Director of Operations", email: "jake@thecentercc.com" },
  { name: "Shawna Balsiger", role: "Director of Affairs", email: "shawna@thecentercc.com" },
  { name: "Dave Wieringa", role: "Head of Leadership", email: "dave@thecentercc.com" },
  { name: "Sarah Johnson", role: "Director of Finance and HR", email: "sarah@thecentercc.com" },
];

/* The starting checklist, grounded in The Center Employee Handbook +
 * Key Contacts. This is only a seed: the live checklist is stored in
 * Firestore (onboarding_template/default) so that editing it applies
 * everywhere -- every computer, the mobile site, and any future hire --
 * instead of being frozen in this file and only changeable by editing
 * code and shipping a new build. The seed is written to the database
 * once, the first time someone opens this page after the template
 * collection is empty; after that this array is never read again. */
const DEFAULT_CHECKLIST = [
  { group: "Accounts & Access", items: [
    { id: "gdrive", text: "Confirm Google Drive shared-drive access (put everything in the shared drive, not a personal drive)" },
    { id: "email", text: "Company email set up and checked" },
    { id: "apricot", text: "Apricot access requested by emailing Sarah and Brad", hint: "Only needed if this role interacts with students — new hires don't get a login automatically." },
    { id: "card", text: "Company credit card issued and Expensify account set up", hint: "Keep every receipt and enter it in Expensify; mileage for any off-site work trip is reimbursable the same way." },
    { id: "claude", text: "Download the Claude desktop app", link: "https://claude.ai/download", linkText: "claude.ai/download" },
  ]},
  { group: "Benefits & Pay", items: [
    { id: "ira", text: "T Rowe Price IRA enrollment reviewed (up to 3% match)", hint: "Contact Sarah with questions about the paperwork." },
    { id: "tasc", text: "TASC Health Reimbursement Account set up and app downloaded", hint: "Up to $4,000/year, resets every July 1 — keep all medical receipts." },
    { id: "smartdollar", text: "SmartDollar / EveryDollar account activated", hint: "Free access to Dave Ramsey's FPU content and 1:1 coaching." },
    { id: "pto", text: "Reviewed PTO policy and how to request time off", hint: "Email Sarah and your direct supervisor; time off is tracked in your shared Google Sheet." },
    { id: "pay", text: "Reviewed pay schedule (paid the 5th and 20th) and pay-stub access" },
  ]},
  { group: "Policies & Handbooks", items: [
    { id: "handbook", text: "Read The Center Employee Handbook" },
    { id: "serve", text: "Read the Revised SERVE Policies and Procedures Handbook" },
    { id: "contacts", text: "Reviewed the Key Contacts page — knows who to ask for what" },
  ]},
  { group: "Orientation", items: [
    { id: "supervisor", text: "Met with direct supervisor / Head of Leadership (Dave Wieringa)" },
    { id: "tour", text: "Toured the building and reviewed the evacuation route" },
    { id: "calendar", text: "Set up calendar habits — meetings, donor appointments, and vacation time all get put on the calendar" },
  ]},
];

let data = {}; // { hireId: { name, startDate, checked: {itemId: bool}, custom: [{id,text}] } }
let currentId = null;
let unsubscribe = null;

// The live, shared checklist -- loaded from Firestore and kept in sync,
// so an edit made on one device shows up on every other one.
let CHECKLIST = [];
let templateUnsub = null;
let canEditTemplate = false;   // Admin/Director only; also enforced by firestore.rules
let editingTemplate = false;

const TEMPLATE_DOC = () => db.collection("onboarding_template").doc("default");

/* Checklist text is typed by staff and then placed into the page. Going
 * through innerHTML with raw text would let anything typed into a
 * checklist item -- deliberately or by accident -- be interpreted as
 * HTML, and a pasted <script> or an onerror= attribute would then run
 * for every person who opens this page. Everything from the database is
 * escaped through here first. */
function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* Only ordinary web links are allowed to become clickable. Without this,
 * a "link" of javascript:... would run code when clicked. */
function safeUrl(url) {
  const value = String(url || "").trim();
  return /^https?:\/\//i.test(value) ? value : "";
}

function allItemIds(hire) {
  const ids = [];
  CHECKLIST.forEach(g => (g.items || []).forEach(i => ids.push(i.id)));
  (hire.custom || []).forEach(c => ids.push(c.id));
  return ids;
}

function progress(hire) {
  const ids = allItemIds(hire);
  const checked = ids.filter(id => hire.checked && hire.checked[id]).length;
  return { checked, total: ids.length, pct: ids.length ? Math.round(100 * checked / ids.length) : 0 };
}

// ---------------------------------------------------------------- auth --

document.getElementById("authForm").addEventListener("submit", e => {
  e.preventDefault();
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const errEl = document.getElementById("authError");
  errEl.textContent = "";
  auth.signInWithEmailAndPassword(email, password).catch(err => {
    errEl.textContent = err && err.message ? err.message : "Couldn't sign in.";
  });
});

document.getElementById("signOutBtn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(user => {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  if (templateUnsub) { templateUnsub(); templateUnsub = null; }
  if (!user) {
    document.getElementById("authGate").style.display = "block";
    document.getElementById("appArea").style.display = "none";
    return;
  }
  const key = user.email.trim().toLowerCase();
  db.collection("users").doc(key).get().then(snap => {
    if (!snap.exists) {
      document.getElementById("authGate").style.display = "block";
      document.getElementById("appArea").style.display = "none";
      document.getElementById("authError").textContent =
        "Signed in, but you don't have a profile yet -- ask an Admin or Director to add you on the mobile site's Team page.";
      return;
    }
    const profile = snap.data() || {};
    // Editing the checklist changes it for every future hire and every
    // person in the organisation, so it's limited to Admin/Director.
    // This only hides the controls -- firestore.rules is what actually
    // enforces it, since anything in a web page can be bypassed.
    canEditTemplate = profile.role === "admin" || profile.role === "director";
    document.getElementById("editChecklistBtn").style.display = canEditTemplate ? "" : "none";
    document.getElementById("whoami").textContent = "Signed in as " + (profile.name || user.email);
    document.getElementById("authGate").style.display = "none";
    document.getElementById("appArea").style.display = "block";
    listenTemplate();
    listen();
  });
});

function listenTemplate() {
  templateUnsub = TEMPLATE_DOC().onSnapshot(snap => {
    if (!snap.exists) {
      // First ever run: publish the built-in checklist so there's
      // something to work from. Only an Admin/Director is allowed to
      // write it; if a staff member happens to be first, they simply
      // see an empty checklist until someone with permission opens it.
      if (canEditTemplate) {
        TEMPLATE_DOC().set({ groups: DEFAULT_CHECKLIST }).catch(() => {});
      }
      CHECKLIST = [];
      renderHireArea();
      return;
    }
    CHECKLIST = (snap.data() || {}).groups || [];
    renderHireArea();
  }, err => {
    document.getElementById("hireArea").innerHTML =
      '<div class="empty">Couldn\'t load the checklist: ' + esc(err.message) + "</div>";
  });
}

function saveTemplate(groups) {
  return TEMPLATE_DOC().set({ groups }, { merge: false }).catch(err => {
    alert("Couldn't save the checklist: " + err.message);
  });
}

function listen() {
  unsubscribe = db.collection("onboarding_hires").onSnapshot(snap => {
    data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    if (!currentId || !data[currentId]) currentId = Object.keys(data)[0] || null;
    renderHireSelect();
    renderHireArea();
  }, err => {
    document.getElementById("hireArea").innerHTML =
      '<div class="empty">Couldn\'t load shared hires: ' + err.message + '</div>';
  });
}

// ---------------------------------------------------------------- CRUD --

function renderHireSelect() {
  const sel = document.getElementById("hireSelect");
  sel.innerHTML = "";
  const ids = Object.keys(data);
  if (!ids.length) {
    const opt = document.createElement("option");
    opt.textContent = "No hires yet — click + New Hire";
    sel.appendChild(opt);
    return;
  }
  ids.forEach(id => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = data[id].name || "(unnamed)";
    if (id === currentId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function newHire() {
  const name = prompt("New hire's name:");
  if (!name) return;
  const id = "h" + Date.now();
  db.collection("onboarding_hires").doc(id).set({ name, startDate: "", checked: {}, custom: [] })
    .then(() => { currentId = id; });
}

function removeHire() {
  if (!currentId) return;
  if (!confirm("Remove " + (data[currentId].name || "this hire") + "'s onboarding record? This can't be undone.")) return;
  db.collection("onboarding_hires").doc(currentId).delete().then(() => { currentId = null; });
}

function updateHire(id, partial) {
  db.collection("onboarding_hires").doc(id).set(partial, { merge: true });
}

function mailtoLink(subject, body) {
  const to = DIRECTORS.map(d => d.email).join(",");
  return "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

function buildUpdateBody(hire) {
  const p = progress(hire);
  let body = `Onboarding update for ${hire.name}${hire.startDate ? " (start date " + hire.startDate + ")" : ""}\n`;
  body += `Progress: ${p.checked}/${p.total} items complete (${p.pct}%)\n\n`;
  CHECKLIST.forEach(g => {
    body += g.group + ":\n";
    g.items.forEach(i => {
      body += `  [${hire.checked && hire.checked[i.id] ? "x" : " "}] ${i.text}\n`;
    });
  });
  if (hire.custom && hire.custom.length) {
    body += "\nAdditional items:\n";
    hire.custom.forEach(c => body += `  [${hire.checked && hire.checked[c.id] ? "x" : " "}] ${c.text}\n`);
  }
  return body;
}

// ---------------------------------------------------------------- render --

function renderHireArea() {
  const area = document.getElementById("hireArea");
  area.innerHTML = "";
  if (!currentId || !data[currentId]) {
    area.innerHTML = '<div class="empty">Add a new hire above to start their onboarding checklist.</div>';
    return;
  }
  const hire = data[currentId];
  const p = progress(hire);

  const card = document.createElement("div");
  card.className = "card";

  let html = "";
  if (p.pct === 100 && p.total > 0) {
    html += `<div class="banner ok">🎉 ${hire.name} has completed every onboarding item.</div>`;
  }
  html += `<div class="addrow" style="margin-bottom:14px;">
    <input type="text" id="startDate" placeholder="Start date (e.g. 2026-08-25)" value="${hire.startDate || ""}">
  </div>`;
  html += `<div class="progresswrap"><div class="progressbar"><div class="progressfill" style="width:${p.pct}%"></div></div>
    <div class="progresslabel">${p.checked} of ${p.total} complete (${p.pct}%)</div></div>`;
  card.innerHTML = html;
  area.appendChild(card);

  card.querySelector("#startDate").addEventListener("change", e => {
    updateHire(currentId, { startDate: e.target.value });
  });

  if (editingTemplate) {
    renderTemplateEditor(area);
  } else {
    CHECKLIST.forEach(g => {
      const sec = document.createElement("section");
      sec.className = "group card";
      let inner = `<h2>${esc(g.group)}</h2>`;
      (g.items || []).forEach(i => {
        const done = hire.checked && hire.checked[i.id];
        const url = safeUrl(i.link);
        inner += `<div class="item ${done ? "done" : ""}">
          <input type="checkbox" data-id="${esc(i.id)}" ${done ? "checked" : ""}>
          <label>${esc(i.text)}${i.hint ? `<span class="hint">${esc(i.hint)}</span>` : ""}${url ? `<span class="hint"><a class="dl" href="${esc(url)}" target="_blank" rel="noopener">${esc(i.linkText || url)}</a></span>` : ""}</label>
        </div>`;
      });
      if (!(g.items || []).length) {
        inner += '<div class="empty" style="padding:10px 0;">No items in this section yet.</div>';
      }
      sec.innerHTML = inner;
      sec.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener("change", () => {
          const checked = Object.assign({}, hire.checked || {});
          checked[cb.dataset.id] = cb.checked;
          updateHire(currentId, { checked });
        });
      });
      area.appendChild(sec);
    });

    if (!CHECKLIST.length) {
      const none = document.createElement("div");
      none.className = "empty";
      none.textContent = canEditTemplate
        ? "The checklist is empty — click Edit Checklist to build it."
        : "The checklist is empty — ask an Admin or Director to set it up.";
      area.appendChild(none);
    }
  }

  // Custom items -- these stay per-hire (just for this person), unlike
  // the shared checklist above which applies to everyone.
  const customSec = document.createElement("section");
  customSec.className = "group card";
  let customHtml = "<h2>Additional Items <span class=\"hint\" style=\"font-weight:400;\">(only for this hire)</span></h2>";
  (hire.custom || []).forEach(c => {
    const done = hire.checked && hire.checked[c.id];
    customHtml += `<div class="item ${done ? "done" : ""}">
      <input type="checkbox" data-id="${esc(c.id)}" ${done ? "checked" : ""}>
      <label>${esc(c.text)}</label>
    </div>`;
  });
  customHtml += `<div class="addrow"><input type="text" id="customInput" placeholder="Add a custom checklist item…"><button class="ghost" id="addCustomBtn" type="button">Add</button></div>`;
  customSec.innerHTML = customHtml;
  customSec.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener("change", () => {
      const checked = Object.assign({}, hire.checked || {});
      checked[cb.dataset.id] = cb.checked;
      updateHire(currentId, { checked });
    });
  });
  customSec.querySelector("#addCustomBtn").addEventListener("click", () => {
    const val = customSec.querySelector("#customInput").value.trim();
    if (!val) return;
    const custom = (hire.custom || []).concat([{ id: "c" + Date.now(), text: val }]);
    updateHire(currentId, { custom });
  });
  area.appendChild(customSec);

  // Notify bar
  const notifyCard = document.createElement("div");
  notifyCard.className = "card notifybar";
  notifyCard.innerHTML = `
    <div class="who">Sends to: ${esc(DIRECTORS.map(d => d.name).join(", "))}</div>
    <a class="primary" style="text-decoration:none; display:inline-block;" href="${mailtoLink(
      (p.pct === 100 ? "Onboarding Complete: " : "Onboarding Update: ") + hire.name,
      buildUpdateBody(hire)
    )}">Email Progress to Admin/Directors</a>
  `;
  area.appendChild(notifyCard);
}

/* ------------------------------------------------- checklist editor --
 * Edits the shared template, not any one hire. Everything is applied to
 * a working copy and only written to the database on Save, so a
 * half-finished edit is never visible to anyone else, and Cancel really
 * does discard.
 *
 * Item ids are the link between the template and each hire's ticked
 * boxes, so they're generated once and never rewritten -- renaming an
 * item's wording deliberately keeps its id, and therefore keeps whoever
 * had already ticked it ticked. Removing an item leaves those old
 * entries harmlessly unused rather than trying to rewrite every hire. */
let draft = null;

function startEditing() {
  draft = JSON.parse(JSON.stringify(CHECKLIST || []));
  editingTemplate = true;
  renderHireArea();
}

function stopEditing() {
  draft = null;
  editingTemplate = false;
  renderHireArea();
}

function newId(prefix) {
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function renderTemplateEditor(area) {
  const intro = document.createElement("div");
  intro.className = "card";
  intro.innerHTML =
    '<h2 style="margin-top:0;">Editing the checklist</h2>' +
    '<div class="hint" style="margin-bottom:10px;">' +
    "Changes apply to every hire and everyone in the organisation, on every device. " +
    "Ticked boxes are kept when you reword an item. Nothing is saved until you click Save." +
    "</div>";
  area.appendChild(intro);

  (draft || []).forEach((group, gi) => {
    const sec = document.createElement("section");
    sec.className = "group card";

    const head = document.createElement("div");
    head.className = "addrow";
    head.style.marginBottom = "10px";
    const groupInput = document.createElement("input");
    groupInput.type = "text";
    groupInput.value = group.group || "";
    groupInput.placeholder = "Section name";
    groupInput.addEventListener("input", () => { draft[gi].group = groupInput.value; });
    const delGroup = document.createElement("button");
    delGroup.type = "button";
    delGroup.className = "danger";
    delGroup.textContent = "Delete Section";
    delGroup.addEventListener("click", () => {
      if (!confirm('Delete the "' + (group.group || "untitled") + '" section and all its items?')) return;
      draft.splice(gi, 1);
      renderHireArea();
    });
    head.appendChild(groupInput);
    head.appendChild(delGroup);
    sec.appendChild(head);

    (group.items || []).forEach((item, ii) => {
      const row = document.createElement("div");
      row.className = "addrow";
      row.style.marginBottom = "6px";

      const textInput = document.createElement("input");
      textInput.type = "text";
      textInput.value = item.text || "";
      textInput.placeholder = "Checklist item";
      textInput.addEventListener("input", () => { draft[gi].items[ii].text = textInput.value; });

      const hintInput = document.createElement("input");
      hintInput.type = "text";
      hintInput.value = item.hint || "";
      hintInput.placeholder = "Note (optional)";
      hintInput.style.maxWidth = "220px";
      hintInput.addEventListener("input", () => { draft[gi].items[ii].hint = hintInput.value; });

      const del = document.createElement("button");
      del.type = "button";
      del.className = "danger";
      del.textContent = "✕";
      del.title = "Remove this item";
      del.addEventListener("click", () => {
        draft[gi].items.splice(ii, 1);
        renderHireArea();
      });

      row.appendChild(textInput);
      row.appendChild(hintInput);
      row.appendChild(del);
      sec.appendChild(row);
    });

    const addRow = document.createElement("div");
    addRow.className = "addrow";
    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "ghost";
    addBtn.textContent = "+ Add item";
    addBtn.addEventListener("click", () => {
      draft[gi].items = (draft[gi].items || []).concat([{ id: newId("i"), text: "" }]);
      renderHireArea();
    });
    addRow.appendChild(addBtn);
    sec.appendChild(addRow);

    area.appendChild(sec);
  });

  const actions = document.createElement("div");
  actions.className = "card";
  const addSection = document.createElement("button");
  addSection.type = "button";
  addSection.className = "ghost";
  addSection.textContent = "+ Add section";
  addSection.addEventListener("click", () => {
    draft.push({ group: "New section", items: [] });
    renderHireArea();
  });

  const save = document.createElement("button");
  save.type = "button";
  save.className = "primary";
  save.textContent = "Save Checklist";
  save.style.marginLeft = "8px";
  save.addEventListener("click", () => {
    // Drop blank rows rather than saving empty checklist items that
    // nobody can act on, and make sure every item has an id.
    const cleaned = (draft || [])
      .map(g => ({
        group: (g.group || "").trim() || "Untitled section",
        items: (g.items || [])
          .filter(i => (i.text || "").trim())
          .map(i => {
            const out = { id: i.id || newId("i"), text: i.text.trim() };
            if ((i.hint || "").trim()) out.hint = i.hint.trim();
            if (safeUrl(i.link)) { out.link = i.link.trim(); out.linkText = i.linkText || i.link; }
            return out;
          }),
      }))
      .filter(g => g.items.length);
    save.disabled = true;
    save.textContent = "Saving…";
    saveTemplate(cleaned).then(() => stopEditing());
  });

  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.className = "ghost";
  cancel.textContent = "Cancel";
  cancel.style.marginLeft = "8px";
  cancel.addEventListener("click", stopEditing);

  actions.appendChild(addSection);
  actions.appendChild(save);
  actions.appendChild(cancel);
  area.appendChild(actions);
}

document.getElementById("hireSelect").addEventListener("change", e => { currentId = e.target.value; renderHireArea(); });
document.getElementById("newHireBtn").addEventListener("click", newHire);
document.getElementById("removeHireBtn").addEventListener("click", removeHire);
document.getElementById("editChecklistBtn").addEventListener("click", () => {
  if (editingTemplate) { stopEditing(); } else { startEditing(); }
});
</script>
</body>
</html>
