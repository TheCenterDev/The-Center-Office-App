<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Center — Office Tools</title>
<meta name="description" content="Office guides, contacts, and tools for The Center for Whitley County Youth.">
<meta name="theme-color" content="#1D2071">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Center Tools">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="login-screen">
  <form id="login-form" class="login-card" autocomplete="on">
    <img src="./icons/icon-192.png" alt="The Center logo" class="login-logo">
    <div class="login-wordmark">The Center</div>
    <div class="login-tagline">Office Tools</div>

    <label for="login-email">Email</label>
    <input id="login-email" name="email" type="email" autocomplete="username" required>

    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required>

    <div id="login-error" class="login-error" role="alert"></div>

    <button type="submit" id="login-submit">Sign in</button>
    <button type="button" id="login-forgot" class="link-btn">Forgot password?</button>

    <p class="login-help">Don't have an account? Ask an Admin or Director to set one up for you.</p>
  </form>
</div>

<div id="app" class="hidden">
  <div id="sidebar-scrim"></div>

  <nav id="sidebar" aria-label="Guides navigation">
    <div id="sidebar-header">
      <img src="./icons/icon-192.png" alt="The Center logo">
      <div class="wordmark">The Center</div>
      <div class="tagline">Office Tools</div>
    </div>
    <div id="search-box">
      <input id="search-input" type="search" placeholder="Search guides…" aria-label="Search guides">
    </div>
    <div id="nav-list" role="list"></div>
    <div id="sidebar-footer">
      <div id="footer-user-name"></div>
      <div id="footer-build" title="Which version of the site you are running"></div>
      <div id="footer-links">
        <button id="settings-nav-btn" class="footer-link" type="button">Settings</button>
        <button id="team-nav-btn" class="footer-link" type="button" style="display:none;">Team</button>
      </div>
    </div>
  </nav>

  <div id="content-wrap">
    <div id="topbar">
      <button id="hamburger" aria-label="Open menu">&#9776;</button>
      <div id="topbar-title">The Center</div>
    </div>
    <div id="reminder-bar" style="display:none;"></div>
    <div id="content-scroll">
      <div id="loading" style="display:none;">Loading…</div>
      <div id="empty-state" style="display:none;">Nothing to show yet.</div>
      <iframe id="content-frame" title="Document viewer" style="display:none;"></iframe>
      <div id="skills-view" class="panel-view" style="display:none;"></div>
      <div id="settings-view" class="panel-view" style="display:none;"></div>
      <div id="team-view" class="panel-view" style="display:none;"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./auth.js"></script>
<script src="./app.js"></script>
</body>
</html>
